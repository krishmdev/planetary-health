server {
  listen 80;
  root /usr/share/nginx/html;

  # Same-origin API paths, forwarded to the activator (which wakes the gateways).
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

  # The SSE stream carries its JWT in the query string (EventSource can't set headers), so it
  # is kept out of the access log.
  location ~ ^/api/org[12]/events {
    access_log off;
    rewrite ^/api/org1/(.*)$ /__org1/$1 last;
    rewrite ^/api/org2/(.*)$ /__org2/$1 last;
  }
  location /__org1/ {
    internal;
    access_log off;
    proxy_pass http://activator:8080/;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_read_timeout 1h;
  }
  location /__org2/ {
    internal;
    access_log off;
    proxy_pass http://activator:8081/;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_read_timeout 1h;
  }
  location /api/org1/ {
    proxy_pass http://activator:8080/;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_read_timeout 180s;
  }
  location /api/org2/ {
    proxy_pass http://activator:8081/;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_read_timeout 180s;
  }
  location / {
    try_files $uri /index.html;
  }
}
