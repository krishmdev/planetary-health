server {
  listen 80;
  root /usr/share/nginx/html;

  # Same-origin API paths, forwarded to the activator (which wakes the gateways).
  location /api/org1/ {
    proxy_pass http://activator:8080/;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_read_timeout 180s;
  }
  location /api/org2/ {
    proxy_pass http://activator:8081/;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_read_timeout 180s;
  }
  location / {
    try_files $uri /index.html;
  }
}
